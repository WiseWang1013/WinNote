name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file exe
        run: dotnet publish src/WinNote/WinNote.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Package appearance themes
        run: Compress-Archive -Path appearance\* -DestinationPath dist\WinNote-appearance.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNote-win-x64
          path: |
            dist/WinNote.exe
            dist/WinNote-appearance.zip

      - name: Attach WinNote.exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinNote.exe
            dist/WinNote-appearance.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
